services:
  - type: web
    name: finshield-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix backend ci --include=dev && npm --prefix backend run build
    startCommand: npm --prefix backend run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: LLM_API_KEY
        sync: false
